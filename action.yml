name: CIFuse CI log triage
description: Group CI failures and append evidence with investigation steps to the job summary.
author: brunnojob
branding:
  icon: zap
  color: green
inputs:
  log:
    description: Path to an existing local text log file
    required: false
  lang:
    description: Report language (en or pt-BR)
    default: en
  baseline:
    description: Optional previous CIFuse JSON report path
    required: false
  fail-on:
    description: Optional findings or new threshold (new requires baseline)
    required: false
  repo:
    description: Optional trusted source checkout path for code and config analysis
    required: false
  repository:
    description: owner/repo for source links
    required: false
  commit:
    description: Exact source checkout SHA for links
    required: false
  github-run:
    description: owner/repo/run-id to download failed logs instead of local log
    required: false
  token:
    description: Token for optional log download or PR comment
    required: false
  comment:
    description: Update a report comment on the current PR (requires pull-requests write)
    default: 'false'
  output:
    description: JSON report output path for artifacts and future baseline comparison
    required: false
outputs:
  report:
    description: JSON report path
    value: ${{ steps.analyze.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Analyze log
      id: analyze
      shell: bash
      env:
        CIFUSE_REPO: ${{ inputs.repo }}
        CIFUSE_REPOSITORY: ${{ inputs.repository }}
        CIFUSE_COMMIT: ${{ inputs.commit }}
        CIFUSE_RUN: ${{ inputs.github-run }}
        CIFUSE_COMMENT: ${{ inputs.comment }}
        CIFUSE_OUTPUT: ${{ inputs.output }}
        GITHUB_TOKEN: ${{ inputs.token }}
        CIFUSE_LOG: ${{ inputs.log }}
        CIFUSE_LANG: ${{ inputs.lang }}
        CIFUSE_BASELINE: ${{ inputs.baseline }}
        CIFUSE_FAIL_ON: ${{ inputs.fail-on }}
      run: node "$GITHUB_ACTION_PATH/src/action.js"
